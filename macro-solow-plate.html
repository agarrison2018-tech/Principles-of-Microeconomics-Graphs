<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Solow Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F3F6;--ink:#101A24;--muted:#5A6675;--construct:#AEBAC7;
  --clay:#B4462F;--teal:#0F6E6C;--rule:#D5DCE4;--focus:#0F6E6C;--gold:#9A6B12;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;padding:16px 18px 14px}
.fig{max-width:540px;margin:0 auto;width:100%}
h1{font-family:"Literata",Georgia,serif;font-weight:600;font-size:17px;line-height:1.25;
  margin:0 0 3px;text-align:center;letter-spacing:-.005em}
.instruction{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 6px}
svg.plot{display:block;width:100%;height:auto;touch-action:none;overflow:visible;
  -webkit-user-select:none;user-select:none}
.layer *{pointer-events:none}
.axis{stroke:var(--muted);stroke-width:1.4;fill:none}
.axlabel{font-size:11.5px;font-weight:600;fill:var(--muted)}
.construct{fill:none;stroke:var(--construct);stroke-width:1.8;stroke-dasharray:1.5 4.5;stroke-linecap:round}
.drop{stroke:var(--construct);stroke-width:1.3;stroke-dasharray:4 4}
.curve{fill:none;stroke-width:2.8;stroke-linecap:round}
.fcurve{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.grip{fill:none;stroke:transparent;stroke-width:22;cursor:ns-resize;pointer-events:stroke}
.gripdot{fill:transparent;stroke:none;cursor:ns-resize;pointer-events:all}
.grip:focus{outline:none}
.focusring{fill:none;stroke:var(--focus);stroke-width:1.6;stroke-dasharray:3 3}
.curvename{font-family:"Literata",Georgia,serif;font-size:14px;font-weight:600}
.tick{font-family:"Literata",Georgia,serif;font-size:13px;font-weight:600}
.chipbg{fill:var(--paper)}
.eqdot{stroke:var(--paper);stroke-width:2.2}
.eqold{fill:none;stroke:var(--construct);stroke-width:1.8}
.cbrace{stroke:var(--gold);stroke-width:2;fill:none}
.caption{border-top:1px solid var(--rule);margin-top:10px;padding-top:9px;text-align:center}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--muted);margin:0}
.readout b{color:var(--ink);font-weight:500}
.codebox{margin-top:10px;border:1.5px solid var(--teal);background:#fff;border-radius:4px;
  display:flex;align-items:flex-start;gap:13px;padding:11px 14px}
.codelabel{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);text-align:left;line-height:1.35;
  flex:0 0 auto;max-width:12ch;padding-top:3px}
.statement{font-family:"Literata",Georgia,serif;font-size:14px;font-weight:600;line-height:1.4;
  color:var(--teal);min-width:0;text-align:left}
.codebox.waiting{border-color:var(--rule);border-style:dashed}
.codebox.waiting .statement{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:400;
  font-size:12.5px;color:var(--muted)}
.footrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:9px}
.slug{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--construct)}
button.reset{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);background:#fff;border:1.3px solid var(--rule);
  border-radius:3px;padding:5px 13px;cursor:pointer}
button.reset:hover{color:var(--ink);border-color:var(--muted)}
button.reset:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.hidden{display:none}
</style>
</head>
<body>
<div class="fig plate">
  <h1 class="title">The Solow Diagram</h1>
  <p class="instruction">Drag a curve up or down with your mouse, or click it and use the &#8593; and &#8595; arrow keys. The dashed lines keep the original position.</p>
  <svg class="plot" viewBox="0 0 470 360" role="img" aria-label="Solow diagram. Output per worker f(k), investment per worker s f(k), and break-even investment (delta plus n) times k, plotted against capital per worker k. Drag the investment curve or the break-even line to change the saving rate or the break-even rate.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6675"></path>
      </marker>
    </defs>
    <line class="axis" x1="70" y1="306" x2="70" y2="18" marker-end="url(#ah)"></line>
    <line class="axis" x1="70" y1="306" x2="452" y2="306" marker-end="url(#ah)"></line>
    <text class="axlabel" x="-162" y="14" transform="rotate(-90)" text-anchor="middle">Output and investment per worker</text>
    <text class="axlabel" x="261" y="350" text-anchor="middle">Capital per worker, k</text>
    <g class="layer"></g>
    <g class="grips"></g>
  </svg>
  <div class="caption">
    <p class="readout" aria-live="polite"></p>
  </div>
  <div class="codebox waiting">
    <span class="codelabel">The graph shows</span>
    <span class="statement" aria-live="polite">Move a curve. This box will describe the new steady state.</span>
  </div>
  <div class="footrow">
    <span class="slug"></span>
    <button type="button" class="reset">Reset</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* URL options:
   s=0.30  d=0.05  n=0     starting saving rate, depreciation, population growth
   kmax=110                right edge of the k axis
   mode=guide|exam         guide prints the statement box; exam shows the graph only
   c=1                     draw the consumption gap c* at the steady state
   name=Solovia  slug=...  labels                                              */
var Q=new URLSearchParams(location.search);
function num(k,def){var v=parseFloat(Q.get(k));return isFinite(v)?v:def;}
var S0=num("s",0.30), BR0=num("d",0.05)+num("n",0), KMAX=num("kmax",110);
var MODE=(Q.get("mode")||"guide").toLowerCase(), SHOWC=Q.get("c")==="1";
var NAME=Q.get("name")||"", BRK=num("n",0)>0||Q.get("bl")==="dn" ? "(δ + n)k" : "δk";
var root=document.querySelector(".plate");
function $(c){return root.querySelector("."+c);}
if(NAME) $("title").textContent="The Solow Diagram for "+NAME;
$("slug").textContent=Q.get("slug")||"ECO 3203 · Solow Model";
if(MODE==="exam"){ $("codebox").classList.add("hidden"); }

var X0=70,X1=440,Y0=306,Y1=26;
var YMAX=Math.sqrt(KMAX)*1.06;
var SMIN=0.05,SMAX=0.80,BRMIN=0.02,BRMAX=0.30;
var st={s:S0,br:BR0}, focus={s:false,br:false}, grips={};

function f(k){return Math.sqrt(k);}
function kstar(s,br){return Math.pow(s/br,2);}
function sx(k){return X0+(k/KMAX)*(X1-X0);}
function sy(y){return Y0-(y/YMAX)*(Y0-Y1);}
function ns(t){return document.createElementNS("http://www.w3.org/2000/svg",t);}
function add(tag,a,parent){var e=ns(tag);for(var k in a)e.setAttribute(k,a[k]);(parent||$("layer")).appendChild(e);return e;}
function text(x,y,t,cls,fill,anchor){var e=add("text",{x:x,y:y,"class":cls,fill:fill,"text-anchor":anchor||"start"});e.textContent=t;return e;}
function bgText(x,y,t,cls,fill,anchor){
  var g=add("g",{});var r=add("rect",{"class":"chipbg"},g);
  var e=add("text",{x:x,y:y,"class":cls,fill:fill,"text-anchor":anchor||"start"},g);e.textContent=t;
  var b=e.getBBox();r.setAttribute("x",b.x-3);r.setAttribute("y",b.y-1);r.setAttribute("width",b.width+6);r.setAttribute("height",b.height+2);
}
function curvePath(fn){var d="",i,k;for(i=0;i<=160;i++){k=KMAX*i/160;var y=Math.min(fn(k),YMAX);
  d+=(i?" L ":"M ")+sx(k).toFixed(1)+" "+sy(y).toFixed(1);}return d;}
function sfPath(s){return curvePath(function(k){return s*f(k);});}
function brEnd(br){var k=Math.min(KMAX,YMAX*0.97/br);return k;}
function brPath(br){var k=brEnd(br);return "M "+sx(0)+" "+sy(0)+" L "+sx(k).toFixed(1)+" "+sy(br*k).toFixed(1);}
function handle(x,y,c){
  add("circle",{cx:x,cy:y,r:8,fill:"var(--paper)",stroke:c,"stroke-width":1.6});
  add("path",{d:"M "+(x-3.2)+" "+(y-1)+" L "+x+" "+(y-4)+" L "+(x+3.2)+" "+(y-1)+
    " M "+(x-3.2)+" "+(y+1)+" L "+x+" "+(y+4)+" L "+(x+3.2)+" "+(y+1),
    fill:"none",stroke:c,"stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round"});
}
var KH=0.86; /* where the s·f(k) handle sits, as a share of KMAX */
function sfHandle(s){return {x:sx(KMAX*KH),y:sy(s*f(KMAX*KH))};}
function brHandle(br){var k=brEnd(br)*0.55;return {x:sx(k),y:sy(br*k)};}

function draw(){
  var L=$("layer");while(L.firstChild)L.removeChild(L.firstChild);
  var s=st.s, br=st.br;
  var sMoved=Math.abs(s-S0)>1e-9, bMoved=Math.abs(br-BR0)>1e-9, moved=sMoved||bMoved;
  var k0=kstar(S0,BR0), k1=kstar(s,br);
  var y0=f(k0), y1=f(k1);

  /* original positions */
  if(sMoved) add("path",{"class":"construct",d:sfPath(S0)});
  if(bMoved) add("path",{"class":"construct",d:brPath(BR0)});

  /* f(k) */
  add("path",{"class":"fcurve",d:curvePath(f)});
  text(sx(KMAX)+6,sy(f(KMAX))+4,"f(k)","curvename","var(--ink)");

  /* old steady state guides */
  if(moved && k0<=KMAX){
    add("line",{"class":"drop",x1:sx(k0),y1:Y0,x2:sx(k0),y2:sy(y0)});
    add("line",{"class":"drop",x1:X0,y1:sy(y0),x2:sx(k0),y2:sy(y0)});
    add("circle",{"class":"eqold",cx:sx(k0),cy:sy(S0*y0),r:4.5});
    add("circle",{"class":"eqold",cx:sx(k0),cy:sy(y0),r:3.5});
  }
  /* new steady state guides */
  if(k1<=KMAX){
    add("line",{"class":"drop",x1:sx(k1),y1:Y0,x2:sx(k1),y2:sy(y1),style:"stroke:#5A6675"});
    add("line",{"class":"drop",x1:X0,y1:sy(y1),x2:sx(k1),y2:sy(y1),style:"stroke:#5A6675"});
  }

  /* consumption gap */
  if(SHOWC && k1<=KMAX){
    var xc=sx(k1)+7, ya=sy(y1), yb=sy(s*y1);
    add("path",{"class":"cbrace",d:"M "+(xc-3)+" "+ya+" L "+xc+" "+ya+" L "+xc+" "+yb+" L "+(xc-3)+" "+yb});
    bgText(xc+5,(ya+yb)/2+4,"c*","curvename","var(--gold)");
  }

  if(focus.s) add("path",{"class":"focusring",d:sfPath(s)});
  if(focus.br) add("path",{"class":"focusring",d:brPath(br)});

  add("path",{"class":"curve",d:brPath(br),stroke:"var(--clay)"});
  add("path",{"class":"curve",d:sfPath(s),stroke:"var(--teal)"});

  var be=brEnd(br);
  text(sx(be)+(be>=KMAX*0.98?6:-4),sy(br*be)+(be>=KMAX*0.98?4:-8),BRK+(bMoved?"′":""),"curvename","var(--clay)",be>=KMAX*0.98?"start":"end");
  text(sx(KMAX)+6,sy(s*f(KMAX))+5,"s·f(k)"+(sMoved?"′":""),"curvename","var(--teal)");

  /* steady-state dots */
  if(k1<=KMAX){
    add("circle",{"class":"eqdot",cx:sx(k1),cy:sy(s*y1),r:5.5,fill:"var(--ink)"});
    add("circle",{"class":"eqdot",cx:sx(k1),cy:sy(y1),r:4,fill:"var(--ink)"});
  }

  /* axis tick labels — symbolic only, no numbers */
  var sub0=moved?"₁":"", sub1=moved?"₂":"";
  if(moved && k0<=KMAX){
    var close=Math.abs(sx(k1)-sx(k0))<26, closeY=Math.abs(sy(y1)-sy(y0))<16;
    text(sx(k0),Y0+(close?34:18),"k*"+sub0,"tick","var(--construct)","middle");
    text(X0-8,sy(y0)+(closeY?(y0>y1?-6:14):4),"y*"+sub0,"tick","var(--construct)","end");
  }
  if(k1<=KMAX){
    text(sx(k1),Y0+18,"k*"+sub1,"tick","var(--ink)","middle");
    text(X0-8,sy(y1)+4,"y*"+sub1,"tick","var(--ink)","end");
  }

  var hs=sfHandle(s), hb=brHandle(br);
  handle(hs.x,hs.y,"var(--teal)");
  handle(hb.x,hb.y,"var(--clay)");

  if(grips.s){grips.s.setAttribute("d",sfPath(s));grips.s.setAttribute("aria-valuenow",s.toFixed(2));
    grips.s.setAttribute("aria-valuetext","saving rate "+s.toFixed(2));
    grips.sdot.setAttribute("cx",hs.x);grips.sdot.setAttribute("cy",hs.y);}
  if(grips.br){grips.br.setAttribute("d",brPath(br));grips.br.setAttribute("aria-valuenow",br.toFixed(3));
    grips.br.setAttribute("aria-valuetext","break-even rate "+br.toFixed(3));
    grips.bdot.setAttribute("cx",hb.x);grips.bdot.setAttribute("cy",hb.y);}

  caption(s,br,k0,k1,moved,sMoved,bMoved);
}

function dir(a,b,up,down,same){var r=b-a,t=Math.max(1e-6,Math.abs(a)*0.004);return r>t?up:(r<-t?down:same);}
function caption(s,br,k0,k1,moved,sMoved,bMoved){
  var brName=BRK==="δk"?"δ":"δ + n";
  $("readout").innerHTML="s = <b>"+s.toFixed(2)+"</b> &middot; "+brName+" = <b>"+br.toFixed(3).replace(/0$/,"")+"</b>";
  if(MODE==="exam") return;
  var box=$("codebox"), el=box.querySelector(".statement");
  if(!moved){el.textContent="Move a curve. This box will describe the new steady state.";box.className="codebox waiting";return;}
  var what=[];
  if(sMoved) what.push("Investment s·f(k) shifts "+(s>S0?"up":"down"));
  if(bMoved) what.push("break-even "+BRK+" gets "+(br>BR0?"steeper":"flatter"));
  var lead=what.join(" and "); lead=lead.charAt(0).toUpperCase()+lead.slice(1);
  var kd=dir(k0,k1,"rise","fall","stay the same");
  var c0=(1-S0)*f(k0), c1=(1-s)*f(k1);
  var cd=dir(c0,c1,"rises","falls","is unchanged");
  var txt;
  if(kd==="stay the same") txt=lead+" — the curves still cross at the same k*, so steady-state capital and income per worker do not change.";
  else txt=lead+" — steady-state capital per worker and income per worker both "+kd+(SHOWC?", and steady-state consumption per worker "+cd+".":".");
  el.textContent=txt; box.className="codebox";
}

/* interaction */
function mkGrip(kind,label){
  var g=add("path",{"class":"grip",tabindex:0,role:"slider","aria-label":label},$("grips"));
  g.addEventListener("focus",function(){focus[kind]=true;draw();});
  g.addEventListener("blur",function(){focus[kind]=false;draw();});
  return g;
}
function mkDot(){return add("circle",{"class":"gripdot",r:15,"aria-hidden":"true"},$("grips"));}
function toData(ev){
  var svg=root.querySelector("svg.plot"), b=svg.getBoundingClientRect(), sc=470/b.width;
  var px=(ev.clientX-b.left)*sc, py=(ev.clientY-b.top)*sc;
  return {k:Math.max(KMAX*0.05,(px-X0)/(X1-X0)*KMAX), y:Math.max(0,(Y0-py)/(Y0-Y1)*YMAX)};
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function snap(v,step){return Math.round(v/step)*step;}
var KFIT=Math.sqrt(KMAX*0.94); /* keep the steady state on the chart */
function setS(v){st.s=clamp(snap(v,0.01),SMIN,Math.min(SMAX,Math.floor(st.br*KFIT/0.01)*0.01));}
function setB(v){st.br=clamp(snap(v,0.005),Math.max(BRMIN,Math.ceil(st.s/KFIT/0.005)*0.005),BRMAX);}
function bind(el,kind){
  var on=false;
  el.addEventListener("pointerdown",function(ev){on=true;el.setPointerCapture(ev.pointerId);ev.preventDefault();});
  el.addEventListener("pointermove",function(ev){
    if(!on)return; var p=toData(ev);
    if(kind==="s") setS(p.y/f(p.k)); else setB(p.y/p.k);
    draw();
  });
  function end(ev){if(!on)return;on=false;try{el.releasePointerCapture(ev.pointerId);}catch(e){}}
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",function(ev){
    var up=ev.key==="ArrowUp"||ev.key==="ArrowRight", dn=ev.key==="ArrowDown"||ev.key==="ArrowLeft";
    if(ev.key==="Home"){if(kind==="s")st.s=S0;else st.br=BR0;}
    else if(up||dn){
      var sign=up?1:-1;
      if(kind==="s") setS(st.s+sign*(ev.shiftKey?0.01:0.05));
      else setB(st.br+sign*(ev.shiftKey?0.005:0.01));
    } else return;
    ev.preventDefault();draw();
  });
}
grips.br=mkGrip("br","Break-even investment line. Drag up to make it steeper or down to make it flatter, or use the up and down arrow keys.");
grips.bdot=mkDot();bind(grips.br,"br");bind(grips.bdot,"br");
grips.s=mkGrip("s","Investment curve s times f of k. Drag up or down to change the saving rate, or use the up and down arrow keys.");
grips.sdot=mkDot();bind(grips.s,"s");bind(grips.sdot,"s");
$("reset").addEventListener("click",function(){st.s=S0;st.br=BR0;draw();});
window.addEventListener("resize",draw);
draw();
})();
</script>
</body>
</html>
