<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>When Both Curves Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F3F6;
  --plate:#DFE4EB;
  --ink:#101A24;
  --muted:#5A6675;
  --construct:#AEBAC7;
  --demand:#B4462F;
  --supply:#0F6E6C;
  --rule:#D5DCE4;
  --focus:#0F6E6C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;
  padding:18px 20px 16px;
  display:flex;flex-direction:column;min-height:100vh;
}
.fig{max-width:520px;margin:0 auto;width:100%}
h1{
  font-family:"Literata",Georgia,serif;font-weight:600;
  font-size:17px;line-height:1.25;margin:0 0 3px;text-align:center;letter-spacing:-.005em;
}
.instruction{
  font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 6px;
}
svg.plot{display:block;width:100%;height:auto;touch-action:none;overflow:visible;
  -webkit-user-select:none;user-select:none}
#layer *{pointer-events:none}
#grips .grip{pointer-events:stroke}
#grips .gripdot{pointer-events:all}
.axis{stroke:var(--muted);stroke-width:1.4;fill:none}
.axlabel{font-size:11.5px;font-weight:600;fill:var(--muted);font-family:"IBM Plex Sans",sans-serif}
.construct{fill:none;stroke:var(--construct);stroke-width:1.8;stroke-dasharray:1.5 4.5;stroke-linecap:round}
.drop{stroke:var(--construct);stroke-width:1.3;stroke-dasharray:4 4}
.curve{fill:none;stroke-width:2.8;stroke-linecap:round;transition:stroke-width .12s}
.grip{fill:none;stroke:transparent;stroke-width:20;cursor:ew-resize}
.gripdot{fill:transparent;stroke:none;cursor:ew-resize}
.grip:focus{outline:none}
.focusring{fill:none;stroke:var(--focus);stroke-width:1.6;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.handle{pointer-events:none}
.curvename{font-family:"Literata",Georgia,serif;font-size:15px;font-weight:600}
.chip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;font-weight:500}
.chipbg{fill:var(--paper)}
.eqdot{stroke:var(--paper);stroke-width:2.2}
.eqold{fill:none;stroke:var(--construct);stroke-width:1.8}
.shiftarrow{stroke-width:1.6;fill:none}
.caption{border-top:1px solid var(--rule);margin-top:12px;padding-top:11px;text-align:center}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-variant-numeric:tabular-nums}
.takeaway{font-family:"Literata",Georgia,serif;font-style:italic;font-size:14px;line-height:1.45;margin:0;color:var(--ink)}
.takeaway.dem{color:var(--demand)}
.takeaway.sup{color:var(--supply)}
.footrow{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:10px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--construct);
}
.slug{white-space:nowrap}
button.reset{
  font:inherit;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;border-bottom:1px solid var(--rule);padding:1px 0;cursor:pointer;
}
button.reset:hover{color:var(--ink);border-color:var(--muted)}
button.reset:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="fig">
  <h1>When both curves move, one effect stays unknown</h1>
  <p class="instruction">Drag either curve. Then drag one further than the other and watch what changes.</p>
  <svg class="plot" viewBox="0 0 460 360" role="img" aria-label="Supply and demand curves crossing at an equilibrium. Both curves can be dragged left or right.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6675"></path>
      </marker>
    </defs>
    <line class="axis" x1="80" y1="300" x2="80" y2="22" marker-end="url(#ah)"></line>
    <line class="axis" x1="80" y1="300" x2="434" y2="300" marker-end="url(#ah)"></line>
    <text class="axlabel" x="-165" y="15" transform="rotate(-90)" text-anchor="middle">Price per unit</text>
    <text class="axlabel" x="251" y="338" text-anchor="middle">Units per week</text>
    <g id="layer"></g>
    <g id="grips"></g>
  </svg>
  <div class="caption">
    <p class="readout" id="readout" aria-live="polite"></p>
    <p class="takeaway" id="takeaway"></p>
  </div>
  <div class="footrow">
    <span class="slug">ECO 2023 · FIG 3.4</span>
    <button type="button" class="reset" id="reset">Reset</button>
  </div>
</div>
<script>
(function(){
"use strict";
var CFG = {
  mode:"eq", dragD:true, dragS:true,
  gripLabelD:"Demand curve. Drag left or right, or use the left and right arrow keys, to shift demand.",
  gripLabelS:"Supply curve. Drag left or right, or use the left and right arrow keys, to shift supply.",
  caption:function(dv,sv,ps,qs,dm,sm,F){
    var r="Equilibrium price "+F.money(ps)+"  ·  quantity "+F.qty(qs);
    if(!dm&&!sm) return {readout:r,takeaway:"Move both curves at once. One of the two effects will stop being predictable.",tone:""};
    if(dm&&!sm) return {readout:r,takeaway:"Only demand has moved, so both effects are still predictable. Now move supply as well.",tone:"dem"};
    if(sm&&!dm) return {readout:r,takeaway:"Only supply has moved, so both effects are still predictable. Now move demand as well.",tone:"sup"};
    var same=(dv>0)===(sv>0);
    return {readout:r, tone:"",
      takeaway: same
        ? "Both curves shifted the same way, so quantity is certain and price is not: drag one further than the other and the price flips."
        : "The curves shifted opposite ways, so price is certain and quantity is not: drag one further than the other and the quantity flips."};
  }
};
var SLOPE=0.8, LIMIT=3.0, MOVED=0.35;
var X0=80,X1=422,Y0=300,Y1=30,QMAX=10,PMAX=10;
var st={d:0,s:0,slide:5};
var focusOn={d:false,s:false,slide:false};
var grips={};

function sx(q){return X0+(q/QMAX)*(X1-X0);}
function sy(p){return Y0-(p/PMAX)*(Y0-Y1);}
function dP(q,v){return 9-SLOPE*(q-v);}
function sP(q,v){return 1+SLOPE*(q-v);}
function dQ(p,v){return (9-p)/SLOPE+v;}
function sQ(p,v){return (p-1)/SLOPE+v;}
function $(id){return document.getElementById(id);}
function ns(t){return document.createElementNS("http://www.w3.org/2000/svg",t);}

function ends(kind,v){
  var lo=0.25,hi=QMAX-0.25,f=(kind==="d"?dP:sP),a=null,b=null,i,q,p;
  for(i=0;i<=400;i++){q=lo+(hi-lo)*i/400;p=f(q,v);
    if(p>=0.3&&p<=PMAX-0.3){if(a===null)a=q;b=q;}}
  if(a===null){a=lo;b=hi;}
  return [a,b];
}
function line(kind,v){
  var e=ends(kind,v),f=(kind==="d"?dP:sP);
  return "M "+sx(e[0]).toFixed(1)+" "+sy(f(e[0],v)).toFixed(1)+
         " L "+sx(e[1]).toFixed(1)+" "+sy(f(e[1],v)).toFixed(1);
}
function money(v){return "$"+v.toFixed(2);}
function qty(v){return v.toFixed(1);}

function add(tag,attrs){
  var e=ns(tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  $("layer").appendChild(e);
  return e;
}
function chip(x,y,txt,anchor,color){
  var g=ns("g");$("layer").appendChild(g);
  var t=ns("text");
  t.setAttribute("class","chip");t.setAttribute("x",x);t.setAttribute("y",y);
  t.setAttribute("text-anchor",anchor);t.setAttribute("fill",color);t.textContent=txt;
  var r=ns("rect");r.setAttribute("class","chipbg");
  g.appendChild(r);g.appendChild(t);
  var bb=t.getBBox();
  r.setAttribute("x",bb.x-3);r.setAttribute("y",bb.y-1.5);
  r.setAttribute("width",bb.width+6);r.setAttribute("height",bb.height+3);
}
function arrow(q0,q1,p,color){
  var y=sy(p),x0=sx(q0),x1=sx(q1);
  if(Math.abs(x1-x0)<7) return;
  var dir=x1>x0?1:-1, tip=x1;
  add("line",{"class":"shiftarrow",x1:x0,y1:y,x2:tip-dir*5,y2:y,stroke:color});
  add("path",{d:"M "+tip+" "+y+" L "+(tip-dir*6.5)+" "+(y-3.6)+" L "+(tip-dir*6.5)+" "+(y+3.6)+" Z",
              fill:color,stroke:"none"});
}
function curveArt(kind,v,color,draggable){
  var d=line(kind,v),e=ends(kind,v),f=(kind==="d"?dP:sP);
  if(focusOn[kind]) add("path",{"class":"focusring",d:d,style:"opacity:1"});
  add("path",{"class":"curve",d:d,stroke:color});
  var q=e[1],prime=(Math.abs(v)>=MOVED?"′":"");
  var t=ns("text");
  t.setAttribute("class","curvename");
  t.setAttribute("x",Math.min(sx(q)+8,X1+24));
  t.setAttribute("y",sy(f(q,v))+(kind==="d"?12:2));
  t.setAttribute("fill",color);
  t.textContent=(kind==="d"?"D":"S")+prime;
  $("layer").appendChild(t);
  if(draggable){
    var frac=(kind==="d"?0.26:0.74), mq=e[0]+(e[1]-e[0])*frac;
    return {x:sx(mq),y:sy(f(mq,v)),c:color};
  }
  return null;
}
function paintHandle(h){
  if(!h) return;
  var g=ns("g");g.setAttribute("class","handle");
  var r=ns("circle");
  r.setAttribute("cx",h.x);r.setAttribute("cy",h.y);r.setAttribute("r",8);
  r.setAttribute("fill","var(--paper)");r.setAttribute("stroke",h.c);
  r.setAttribute("stroke-width","1.6");g.appendChild(r);
  var p=ns("path");
  p.setAttribute("d","M "+(h.x-3.8)+" "+(h.y-3.2)+" L "+(h.x-.8)+" "+h.y+" L "+(h.x-3.8)+" "+(h.y+3.2)+
                 " M "+(h.x+3.8)+" "+(h.y-3.2)+" L "+(h.x+.8)+" "+h.y+" L "+(h.x+3.8)+" "+(h.y+3.2));
  p.setAttribute("fill","none");p.setAttribute("stroke",h.c);
  p.setAttribute("stroke-width","1.6");p.setAttribute("stroke-linecap","round");
  p.setAttribute("stroke-linejoin","round");
  g.appendChild(p);
  $("layer").appendChild(g);
}

function draw(){
  var layer=$("layer");
  while(layer.firstChild) layer.removeChild(layer.firstChild);

  var dv=st.d, sv=st.s;
  var dMoved=Math.abs(dv)>=MOVED, sMoved=Math.abs(sv)>=MOVED;
  var qs,ps;
  if(CFG.mode==="slide"){ ps=st.slide; qs=sQ(ps,0); }
  else { qs=5+0.5*(dv+sv); ps=5+0.4*(dv-sv); }

  if(dMoved) add("path",{"class":"construct",d:line("d",0)});
  if(sMoved) add("path",{"class":"construct",d:line("s",0)});

  add("line",{"class":"drop",x1:X0,y1:sy(ps),x2:sx(qs),y2:sy(ps)});
  add("line",{"class":"drop",x1:sx(qs),y1:sy(ps),x2:sx(qs),y2:Y0});

  if(dMoved) arrow(dQ(7.5,0),dQ(7.5,dv),7.5,"var(--demand)");
  if(sMoved) arrow(sQ(2.5,0),sQ(2.5,sv),2.5,"var(--supply)");

  var hd=(CFG.showD===false)?null:curveArt("d",dv,"var(--demand)",CFG.dragD);
  var hs=curveArt("s",sv,"var(--supply)",CFG.dragS);

  if(CFG.mode!=="slide" && (dMoved||sMoved)){
    add("circle",{cx:sx(5),cy:sy(5),r:6,fill:"var(--paper)",stroke:"none"});
    add("circle",{"class":"eqold",cx:sx(5),cy:sy(5),r:4.5});
  }

  if(CFG.mode==="slide"){
    if(focusOn.slide)
      add("circle",{cx:sx(qs),cy:sy(ps),r:14,fill:"none",stroke:"var(--focus)",
                    "stroke-width":1.6,"stroke-dasharray":"3 3"});
    add("circle",{cx:sx(qs),cy:sy(ps),r:11,fill:"none",stroke:"var(--supply)",
                  "stroke-width":1.4,"stroke-dasharray":"2 3"});
    add("circle",{"class":"eqdot",cx:sx(qs),cy:sy(ps),r:6,fill:"var(--supply)"});
  } else {
    add("circle",{"class":"eqdot",cx:sx(qs),cy:sy(ps),r:5.5,fill:"var(--ink)"});
  }

  chip(X0-9,sy(ps)+4,money(ps),"end","var(--ink)");
  chip(sx(qs),Y0+17,qty(qs),"middle","var(--ink)");

  paintHandle(hd); paintHandle(hs);
  updateGrips(qs,ps,hd,hs);
  captions(dv,sv,ps,qs,dMoved,sMoved);
}

function updateGrips(qs,ps,hd,hs){
  if(grips.ddot&&hd){grips.ddot.setAttribute("cx",hd.x);grips.ddot.setAttribute("cy",hd.y);}
  if(grips.sdot&&hs){grips.sdot.setAttribute("cx",hs.x);grips.sdot.setAttribute("cy",hs.y);}
  if(grips.d){grips.d.setAttribute("d",line("d",st.d));
              grips.d.setAttribute("aria-valuenow",st.d.toFixed(1));
              grips.d.setAttribute("aria-valuetext",valueText("d"));}
  if(grips.s){grips.s.setAttribute("d",line("s",st.s));
              grips.s.setAttribute("aria-valuenow",st.s.toFixed(1));
              grips.s.setAttribute("aria-valuetext",valueText("s"));}
  if(grips.slide){grips.slide.setAttribute("aria-valuenow",ps.toFixed(2));
    grips.slide.setAttribute("aria-valuetext","Price "+money(ps)+", quantity supplied "+qty(qs));}
}
function valueText(kind){
  var v=st[kind],name=(kind==="d"?"Demand":"Supply");
  if(Math.abs(v)<MOVED) return name+" unchanged";
  return name+" shifted "+(v>0?"right":"left")+" by "+Math.abs(v).toFixed(1)+" units";
}

/* ---- persistent interactive layer ---- */
function mkGrip(kind,label){
  var g=ns("path");
  g.setAttribute("class","grip");
  g.setAttribute("tabindex","0");
  g.setAttribute("role","slider");
  g.setAttribute("aria-label",label);
  g.setAttribute("aria-valuemin","-3");
  g.setAttribute("aria-valuemax","3");
  $("grips").appendChild(g);
  g.addEventListener("focus",function(){focusOn[kind]=true;draw();});
  g.addEventListener("blur",function(){focusOn[kind]=false;draw();});
  return g;
}
function mkDot(kind){
  var c=ns("circle");
  c.setAttribute("class","gripdot");
  c.setAttribute("r","15");
  c.setAttribute("aria-hidden","true");
  $("grips").appendChild(c);
  return c;
}
function perPxX(el){
  var b=el.ownerSVGElement.getBoundingClientRect();
  return (460/b.width)*QMAX/(X1-X0);
}
function perPxY(el){
  var b=el.ownerSVGElement.getBoundingClientRect();
  return (360/b.height)*PMAX/(Y0-Y1);
}
function bindShift(el,kind){
  var on=false,x0=0,v0=0;
  el.addEventListener("pointerdown",function(ev){
    on=true;x0=ev.clientX;v0=st[kind];
    el.setPointerCapture(ev.pointerId);el.style.cursor="grabbing";ev.preventDefault();
  });
  el.addEventListener("pointermove",function(ev){
    if(!on)return;
    st[kind]=Math.max(-LIMIT,Math.min(LIMIT,v0+(ev.clientX-x0)*perPxX(el)));
    draw();
  });
  function end(ev){if(!on)return;on=false;el.style.cursor="";
    try{el.releasePointerCapture(ev.pointerId);}catch(e){}}
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",function(ev){
    var step=ev.shiftKey?0.1:0.4;
    if(ev.key==="ArrowRight")st[kind]=Math.min(LIMIT,st[kind]+step);
    else if(ev.key==="ArrowLeft")st[kind]=Math.max(-LIMIT,st[kind]-step);
    else if(ev.key==="Home")st[kind]=0;
    else return;
    ev.preventDefault();draw();
  });
}
function bindSlide(el){
  var on=false,y0=0,p0=0;
  el.addEventListener("pointerdown",function(ev){
    on=true;y0=ev.clientY;p0=st.slide;
    el.setPointerCapture(ev.pointerId);ev.preventDefault();
  });
  el.addEventListener("pointermove",function(ev){
    if(!on)return;
    st.slide=Math.max(1.5,Math.min(8.5,p0-(ev.clientY-y0)*perPxY(el)));draw();
  });
  function end(ev){if(!on)return;on=false;
    try{el.releasePointerCapture(ev.pointerId);}catch(e){}}
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",function(ev){
    var step=ev.shiftKey?0.1:0.4;
    if(ev.key==="ArrowUp")st.slide=Math.min(8.5,st.slide+step);
    else if(ev.key==="ArrowDown")st.slide=Math.max(1.5,st.slide-step);
    else return;
    ev.preventDefault();draw();
  });
}

function captions(dv,sv,ps,qs,dMoved,sMoved){
  var C=CFG.caption(dv,sv,ps,qs,dMoved,sMoved,{money:money,qty:qty});
  $("readout").textContent=C.readout;
  var t=$("takeaway");
  t.textContent=C.takeaway;
  t.className="takeaway"+(C.tone?" "+C.tone:"");
}

if(CFG.mode==="slide"){
  grips.slide=mkGrip("slide",CFG.gripLabelS);
  grips.slide.setAttribute("d",line("s",0));
  grips.slide.style.cursor="ns-resize";
  bindSlide(grips.slide);
}else{
  if(CFG.dragD){grips.d=mkGrip("d",CFG.gripLabelD);bindShift(grips.d,"d");
                grips.ddot=mkDot("d");bindShift(grips.ddot,"d");}
  if(CFG.dragS){grips.s=mkGrip("s",CFG.gripLabelS);bindShift(grips.s,"s");
                grips.sdot=mkDot("s");bindShift(grips.sdot,"s");}
}
$("reset").addEventListener("click",function(){st.d=0;st.s=0;st.slide=5;draw();});
window.addEventListener("resize",draw);
draw();
})();
</script>
</body>
</html>
